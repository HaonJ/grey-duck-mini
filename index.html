<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grey Duck Mini - Frisbee MMR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Navigation Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🦆</span>
        <h1 class="font-bold text-lg text-emerald-400">Grey Duck Mini</h1>
      </div>
      <button onclick="promptApiUrl()" class="flex items-center gap-2 bg-slate-900 border border-slate-700 px-3 py-1 rounded-full text-xs font-mono">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
        <span id="status-text">Connecting...</span>
      </button>
    </div>
    <!-- Navigation Tabs -->
    <nav class="max-w-4xl mx-auto px-4 flex border-t border-slate-700/50 overflow-x-auto">
      <button onclick="switchTab('leaderboard')" id="tab-leaderboard" class="px-4 py-2 text-sm font-semibold border-b-2 border-emerald-400 text-emerald-400 whitespace-nowrap">Leaderboard</button>
      <button onclick="switchTab('matchmaker')" id="tab-matchmaker" class="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap">Matchmaker</button>
      <button onclick="switchTab('matches')" id="tab-matches" class="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap">History</button>
      <button onclick="switchTab('record')" id="tab-record" class="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap">Record Match</button>
      <button onclick="switchTab('players')" id="tab-players" class="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap">Register</button>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- LEADERBOARD TAB -->
    <section id="view-leaderboard" class="space-y-4">
      <h2 class="text-xl font-bold text-slate-200">Player Leaderboard</h2>
      <div class="bg-slate-800 border border-slate-700 rounded-lg overflow-hidden shadow-lg">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900/60 text-slate-400 text-xs uppercase border-b border-slate-700">
            <tr>
              <th class="p-3">Rank</th>
              <th class="p-3">Player</th>
              <th class="p-3 text-center">MMR</th>
              <th class="p-3 text-center">W / L</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body" class="divide-y divide-slate-700">
            <tr><td colspan="4" class="p-4 text-center text-slate-500">Loading players...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- MATCHMAKER TAB -->
    <section id="view-matchmaker" class="space-y-4 hidden">
      <h2 class="text-xl font-bold text-slate-200">Multi-Team Generator</h2>
      
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg space-y-4">
        <div class="flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center bg-slate-900/50 p-3 rounded border border-slate-700">
          <div>
            <label class="block text-xs font-semibold text-slate-300">Number of Teams:</label>
            <select id="num-teams-select" class="bg-slate-800 border border-slate-600 text-slate-200 text-sm rounded p-1.5 mt-1">
              <option value="2" selected>2 Teams</option>
              <option value="3">3 Teams</option>
              <option value="4">4 Teams</option>
              <option value="5">5 Teams</option>
              <option value="6">6 Teams</option>
            </select>
          </div>
          <div class="flex gap-2 w-full sm:w-auto">
            <button onclick="generateTeams('balanced')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-2 px-3 rounded text-xs">⚖️ Balanced</button>
            <button onclick="generateTeams('random')" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-3 rounded text-xs">🎲 Random</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-2">Check Present Players:</label>
          <div id="matchmaker-player-list" class="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-slate-900/60 p-3 rounded border border-slate-700 max-h-52 overflow-y-auto"></div>
        </div>
      </div>

      <!-- Generated Results Container -->
      <div id="generated-teams-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>
    </section>

    <!-- MATCH HISTORY TAB -->
    <section id="view-matches" class="space-y-4 hidden">
      <h2 class="text-xl font-bold text-slate-200">Daily Game History</h2>
      <div id="matches-grouped-container" class="space-y-6"></div>
    </section>

    <!-- RECORD MATCH TAB -->
    <section id="view-record" class="space-y-4 hidden">
      <h2 class="text-xl font-bold text-slate-200">Record Game Result</h2>
      <form onsubmit="submitMatch(event)" class="bg-slate-800 border border-slate-700 p-4 rounded-lg space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2 bg-slate-900/50 p-3 rounded border border-slate-700">
            <h3 class="font-bold text-emerald-400">Team 1</h3>
            <label class="text-xs text-slate-400">Select Players (Ctrl/Cmd to pick multiple):</label>
            <select id="match-team1" multiple class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-slate-200 h-28"></select>
            <div>
              <label class="text-xs text-slate-400">Score:</label>
              <input id="match-score1" type="number" min="0" required class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-slate-200">
            </div>
          </div>
          <div class="space-y-2 bg-slate-900/50 p-3 rounded border border-slate-700">
            <h3 class="font-bold text-indigo-400">Team 2</h3>
            <label class="text-xs text-slate-400">Select Players (Ctrl/Cmd to pick multiple):</label>
            <select id="match-team2" multiple class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-slate-200 h-28"></select>
            <div>
              <label class="text-xs text-slate-400">Score:</label>
              <input id="match-score2" type="number" min="0" required class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-slate-200">
            </div>
          </div>
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-2 px-4 rounded text-slate-900">Submit Match</button>
      </form>
    </section>

    <!-- REGISTER PLAYER TAB -->
    <section id="view-players" class="space-y-4 hidden">
      <h2 class="text-xl font-bold text-slate-200">Register New Player</h2>
      <form onsubmit="registerPlayer(event)" class="bg-slate-800 border border-slate-700 p-4 rounded-lg space-y-3 max-w-md">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Player Name</label>
          <input id="player-name-input" type="text" required class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-400">
        </div>
        <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 font-bold py-2 px-4 rounded text-slate-900 text-sm w-full">Add Player</button>
      </form>
    </section>

  </main>

  <!-- EDIT MATCH MODAL -->
  <div id="edit-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-lg max-w-md w-full p-4 space-y-4">
      <h3 class="text-lg font-bold text-slate-200">Edit Game Result</h3>
      <input type="hidden" id="edit-match-id">
      
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400">Team 1 Players (comma-separated):</label>
          <input id="edit-team1-players" type="text" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-slate-200">
        </div>
        <div>
          <label class="text-xs text-slate-400">Team 1 Score:</label>
          <input id="edit-team1-score" type="number" min="0" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-slate-200">
        </div>
        <div>
          <label class="text-xs text-slate-400">Team 2 Players (comma-separated):</label>
          <input id="edit-team2-players" type="text" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-slate-200">
        </div>
        <div>
          <label class="text-xs text-slate-400">Team 2 Score:</label>
          <input id="edit-team2-score" type="number" min="0" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-slate-200">
        </div>
      </div>

      <div class="flex gap-2 justify-end pt-2">
        <button onclick="closeEditModal()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded">Cancel</button>
        <button onclick="saveMatchEdit()" class="px-3 py-1.5 text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold rounded">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    let apiBaseUrl = localStorage.getItem("mmr_api_url") || "https://grey-duck-mini-api.onrender.com";
    let cachedPlayers = [];
    let cachedMatches = [];

    function promptApiUrl() {
      const input = prompt("Enter backend Render URL:", apiBaseUrl);
      if (input) {
        apiBaseUrl = input.trim().replace(/\/$/, "");
        localStorage.setItem("mmr_api_url", apiBaseUrl);
        checkApiHealth();
      }
    }

    async function checkApiHealth() {
      const dot = document.getElementById("status-dot");
      const text = document.getElementById("status-text");
      try {
        const res = await fetch(`${apiBaseUrl}/`);
        if (res.ok) {
          dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
          text.innerText = "Connected";
          fetchLeaderboard();
        } else { throw new Error(); }
      } catch {
        dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
        text.innerText = "Offline";
      }
    }

    function switchTab(tab) {
      ["leaderboard", "matchmaker", "matches", "record", "players"].forEach(t => {
        document.getElementById(`view-${t}`).classList.add("hidden");
        const btn = document.getElementById(`tab-${t}`);
        if (btn) btn.className = "px-4 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap";
      });

      document.getElementById(`view-${tab}`).classList.remove("hidden");
      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.className = "px-4 py-2 text-sm font-semibold border-b-2 border-emerald-400 text-emerald-400 whitespace-nowrap";

      if (tab === "leaderboard") fetchLeaderboard();
      if (tab === "matchmaker") renderMatchmakerCheckboxes();
      if (tab === "matches") fetchMatches();
      if (tab === "record") populatePlayerDropdowns();
    }

    async function fetchLeaderboard() {
      try {
        const res = await fetch(`${apiBaseUrl}/players/`);
        if (!res.ok) throw new Error();
        cachedPlayers = await res.json();
        
        cachedPlayers.sort((a, b) => {
          const ordA = Math.max(0, a.mu - 1.5 * a.sigma);
          const ordB = Math.max(0, b.mu - 1.5 * b.sigma);
          return ordB - ordA;
        });

        const tbody = document.getElementById("leaderboard-body");
        if (cachedPlayers.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">No players registered.</td></tr>`;
          return;
        }

        tbody.innerHTML = cachedPlayers.map((p, i) => {
          const ordinal = Math.max(0, p.mu - 1.5 * p.sigma).toFixed(1);
          return `
            <tr class="hover:bg-slate-800/50">
              <td class="p-3 font-mono text-slate-400">#${i + 1}</td>
              <td class="p-3 font-semibold text-slate-100">${p.name}</td>
              <td class="p-3 text-center font-bold text-emerald-400">${ordinal}</td>
              <td class="p-3 text-center text-slate-400">${p.wins} / ${p.losses}</td>
            </tr>
          `;
        }).join('');
      } catch (err) { console.error(err); }
    }

    function renderMatchmakerCheckboxes() {
      const container = document.getElementById("matchmaker-player-list");
      if (cachedPlayers.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-500">No players found.</span>`;
        return;
      }
      container.innerHTML = cachedPlayers.map(p => `
        <label class="flex items-center gap-2 text-sm text-slate-200 cursor-pointer select-none">
          <input type="checkbox" value="${p.name}" class="mm-player-cb rounded bg-slate-800 border-slate-600 text-emerald-500">
          <span>${p.name}</span>
        </label>
      `).join('');
    }

    function generateTeams(mode) {
      const checkboxes = document.querySelectorAll('.mm-player-cb:checked');
      const selectedNames = Array.from(checkboxes).map(cb => cb.value);
      const numTeams = parseInt(document.getElementById("num-teams-select").value);

      if (selectedNames.length < numTeams) {
        alert(`Select at least ${numTeams} players to generate teams.`);
        return;
      }

      let selectedObjects = cachedPlayers.filter(p => selectedNames.includes(p.name));
      let teams = Array.from({ length: numTeams }, () => []);

      if (mode === 'random') {
        selectedObjects.sort(() => Math.random() - 0.5);
        selectedObjects.forEach((p, idx) => teams[idx % numTeams].push(p));
      } else {
        selectedObjects.sort((a, b) => (b.mu - 1.5 * b.sigma) - (a.mu - 1.5 * a.sigma));
        let sums = new Array(numTeams).fill(0);
        selectedObjects.forEach(p => {
          let minIdx = sums.indexOf(Math.min(...sums));
          teams[minIdx].push(p);
          sums[minIdx] += Math.max(0, p.mu - 1.5 * p.sigma);
        });
      }

      const container = document.getElementById("generated-teams-container");
      container.classList.remove("hidden");
      container.innerHTML = teams.map((team, i) => {
        const avg = (team.reduce((acc, p) => acc + Math.max(0, p.mu - 1.5 * p.sigma), 0) / (team.length || 1)).toFixed(1);
        return `
          <div class="bg-slate-800 border border-slate-700 p-3 rounded-lg">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-bold text-emerald-400 text-sm">Team ${i + 1}</h3>
              <span class="text-xs font-mono text-slate-400">Avg MMR: ${avg}</span>
            </div>
            <ul class="text-xs text-slate-200 space-y-1">
              ${team.map(p => `<li>• ${p.name}</li>`).join('')}
            </ul>
          </div>
        `;
      }).join('');
    }

    async function fetchMatches() {
      try {
        const res = await fetch(`${apiBaseUrl}/matches/`);
        if (!res.ok) throw new Error();
        cachedMatches = await res.json();
        const container = document.getElementById("matches-grouped-container");

        if (cachedMatches.length === 0) {
          container.innerHTML = `<p class="text-slate-500 text-center py-4">No matches played yet.</p>`;
          return;
        }

        // Group matches by date
        const grouped = {};
        cachedMatches.forEach(m => {
          const dateStr = new Date(m.created_at).toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
          if (!grouped[dateStr]) grouped[dateStr] = [];
          grouped[dateStr].push(m);
        });

        container.innerHTML = Object.keys(grouped).map(date => `
          <div class="space-y-3">
            <h3 class="text-sm font-bold text-emerald-400 border-b border-slate-700 pb-1">${date}</h3>
            <div class="space-y-2">
              ${grouped[date].map(m => {
                const t1Win = m.team1_score > m.team2_score;
                return `
                  <div class="bg-slate-800 border border-slate-700 p-3 rounded-lg flex justify-between items-center text-xs">
                    <div class="flex items-center gap-3">
                      <span class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-mono font-bold">+${m.mmr_change} MMR</span>
                      <div>
                        <span class="${t1Win ? 'text-emerald-400 font-bold' : 'text-slate-300'}">${m.team1_players} (${m.team1_score})</span>
                        <span class="text-slate-500 font-bold mx-1">vs</span>
                        <span class="${!t1Win ? 'text-indigo-400 font-bold' : 'text-slate-300'}">${m.team2_players} (${m.team2_score})</span>
                      </div>
                    </div>
                    <div class="flex gap-2">
                      <button onclick="openEditModal(${m.id})" class="text-slate-400 hover:text-slate-200">✏️</button>
                      <button onclick="deleteMatch(${m.id})" class="text-rose-400 hover:text-rose-200">🗑️</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }

    function openEditModal(id) {
      const match = cachedMatches.find(m => m.id === id);
      if (!match) return;
      document.getElementById("edit-match-id").value = match.id;
      document.getElementById("edit-team1-players").value = match.team1_players;
      document.getElementById("edit-team1-score").value = match.team1_score;
      document.getElementById("edit-team2-players").value = match.team2_players;
      document.getElementById("edit-team2-score").value = match.team2_score;
      document.getElementById("edit-modal").classList.remove("hidden");
    }

    function closeEditModal() {
      document.getElementById("edit-modal").classList.add("hidden");
    }

    async function saveMatchEdit() {
      const id = document.getElementById("edit-match-id").value;
      const t1 = document.getElementById("edit-team1-players").value.split(",").map(s => s.trim());
      const t2 = document.getElementById("edit-team2-players").value.split(",").map(s => s.trim());
      const s1 = parseInt(document.getElementById("edit-team1-score").value);
      const s2 = parseInt(document.getElementById("edit-team2-score").value);

      try {
        const res = await fetch(`${apiBaseUrl}/matches/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ team1_players: t1, team2_players: t2, team1_score: s1, team2_score: s2 })
        });
        if (res.ok) {
          closeEditModal();
          fetchMatches();
        } else { alert("Failed to save match edit."); }
      } catch { alert("Server request failed."); }
    }

    async function deleteMatch(id) {
      if (!confirm("Delete this match record? Ratings will recalculate.")) return;
      try {
        const res = await fetch(`${apiBaseUrl}/matches/${id}`, { method: "DELETE" });
        if (res.ok) fetchMatches();
      } catch { alert("Failed to delete match."); }
    }

    function populatePlayerDropdowns() {
      const select1 = document.getElementById("match-team1");
      const select2 = document.getElementById("match-team2");
      const options = cachedPlayers.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
      select1.innerHTML = options;
      select2.innerHTML = options;
    }

    async function registerPlayer(e) {
      e.preventDefault();
      const input = document.getElementById("player-name-input");
      const name = input.value.trim();
      if (!name) return;

      try {
        const res = await fetch(`${apiBaseUrl}/players/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        if (res.ok) {
          input.value = "";
          alert(`Player "${name}" added!`);
          switchTab("leaderboard");
        } else {
          const data = await res.json();
          alert(`Error: ${data.detail || "Could not register player"}`);
        }
      } catch { alert("Server request failed."); }
    }

    async function submitMatch(e) {
      e.preventDefault();
      const t1 = Array.from(document.getElementById("match-team1").selectedOptions).map(o => o.value);
      const t2 = Array.from(document.getElementById("match-team2").selectedOptions).map(o => o.value);
      const s1 = parseInt(document.getElementById("match-score1").value);
      const s2 = parseInt(document.getElementById("match-score2").value);

      if (t1.length === 0 || t2.length === 0) {
        alert("Select at least one player for each team.");
        return;
      }

      try {
        const res = await fetch(`${apiBaseUrl}/matches/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ team1_players: t1, team2_players: t2, team1_score: s1, team2_score: s2 })
        });

        if (res.ok) {
          alert("Match recorded!");
          switchTab("matches");
        } else { alert("Failed to submit match."); }
      } catch { alert("Server request failed."); }
    }

    checkApiHealth();
  </script>
</body>
</html>
