<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grey Duck Mini - Frisbee MMR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Navigation Bar -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🦆</span>
        <h1 class="font-bold text-lg text-emerald-400">Grey Duck Mini</h1>
      </div>
      <div class="flex items-center gap-3">
        <!-- Status Indicator -->
        <button onclick="promptApiUrl()" class="flex items-center gap-2 bg-slate-900 border border-slate-700 px-3 py-1 rounded-full text-xs font-mono">
          <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
          <span id="status-text">Connecting...</span>
        </button>
      </div>
    </div>
    <!-- Tabs -->
    <nav class="max-w-4xl mx-auto px-4 flex border-t border-slate-700/50">
      <button onclick="switchTab('leaderboard')" id="tab-leaderboard" class="px-4 py-2 text-sm font-semibold border-b-2 border-emerald-400 text-emerald-400">Leaderboard</button>
      <button onclick="switchTab('matches')" id="tab-matches" class="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200">Match History</button>
      <button onclick="switchTab('record')" id="tab-record" class="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200">Record Match</button>
      <button onclick="switchTab('players')" id="tab-players" class="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200">Register</button>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- LEADERBOARD TAB -->
    <section id="view-leaderboard" class="space-y-4">
      <h2 class="text-xl font-bold text-slate-200">Player Leaderboard</h2>
      <div class="bg-slate-800 border border-slate-700 rounded-lg overflow-hidden shadow-lg">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900/60 text-slate-400 text-xs uppercase border-b border-slate-700">
            <tr>
              <th class="p-3">Rank</th>
              <th class="p-3">Player</th>
              <th class="p-3 text-center">MMR (Ordinal)</th>
              <th class="p-3 text-center">W / L</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body" class="divide-y divide-slate-700">
            <tr><td colspan="4" class="p-4 text-center text-slate-500">Loading players...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- MATCH HISTORY TAB -->
    <section id="view-matches" class="space-y-4 hidden">
      <h2 class="text-xl font-bold text-slate-200">Game Scores & History</h2>
      <div id="matches-container" class="space-y-3">
        <p class="text-slate-500 text-center py-4">Loading match history...</p>
      </div>
    </section>

    <!-- RECORD MATCH TAB -->
    <section id="view-record" class="space-y-4 hidden">
      <h2 class="text-xl font-bold text-slate-200">Record Game Result</h2>
      <form onsubmit="submitMatch(event)" class="bg-slate-800 border border-slate-700 p-4 rounded-lg space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Team 1 -->
          <div class="space-y-2 bg-slate-900/50 p-3 rounded border border-slate-700">
            <h3 class="font-bold text-emerald-400">Team 1</h3>
            <label class="text-xs text-slate-400">Select Players (hold Ctrl/Cmd to select multiple):</label>
            <select id="match-team1" multiple class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-slate-200 h-28"></select>
            <div>
              <label class="text-xs text-slate-400">Score:</label>
              <input id="match-score1" type="number" min="0" required class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-slate-200">
            </div>
          </div>
          <!-- Team 2 -->
          <div class="space-y-2 bg-slate-900/50 p-3 rounded border border-slate-700">
            <h3 class="font-bold text-indigo-400">Team 2</h3>
            <label class="text-xs text-slate-400">Select Players (hold Ctrl/Cmd to select multiple):</label>
            <select id="match-team2" multiple class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-slate-200 h-28"></select>
            <div>
              <label class="text-xs text-slate-400">Score:</label>
              <input id="match-score2" type="number" min="0" required class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-slate-200">
            </div>
          </div>
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-2 px-4 rounded text-slate-900">Submit Match</button>
      </form>
    </section>

    <!-- REGISTER PLAYER TAB -->
    <section id="view-players" class="space-y-4 hidden">
      <h2 class="text-xl font-bold text-slate-200">Register New Player</h2>
      <form onsubmit="registerPlayer(event)" class="bg-slate-800 border border-slate-700 p-4 rounded-lg space-y-3 max-w-md">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Player Name</label>
          <input id="player-name-input" type="text" required placeholder="e.g. Goose" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-400">
        </div>
        <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 font-bold py-2 px-4 rounded text-slate-900 text-sm w-full">Add Player</button>
      </form>
    </section>

  </main>

  <script>
    let apiBaseUrl = localStorage.getItem("mmr_api_url") || "https://grey-duck-mini-api.onrender.com";
    let cachedPlayers = [];

    function promptApiUrl() {
      const input = prompt("Enter backend Render URL:", apiBaseUrl);
      if (input) {
        apiBaseUrl = input.trim().replace(/\/$/, "");
        localStorage.setItem("mmr_api_url", apiBaseUrl);
        checkApiHealth();
      }
    }

    async function checkApiHealth() {
      const dot = document.getElementById("status-dot");
      const text = document.getElementById("status-text");
      try {
        const res = await fetch(`${apiBaseUrl}/`);
        if (res.ok) {
          dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
          text.innerText = "Connected";
          fetchLeaderboard();
          fetchMatches();
        } else {
          throw new Error();
        }
      } catch {
        dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
        text.innerText = "Offline";
      }
    }

    function switchTab(tab) {
      ["leaderboard", "matches", "record", "players"].forEach(t => {
        document.getElementById(`view-${t}`).classList.add("hidden");
        const btn = document.getElementById(`tab-${t}`);
        btn.className = "px-4 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200";
      });

      document.getElementById(`view-${tab}`).classList.remove("hidden");
      const activeBtn = document.getElementById(`tab-${tab}`);
      activeBtn.className = "px-4 py-2 text-sm font-semibold border-b-2 border-emerald-400 text-emerald-400";

      if (tab === "leaderboard") fetchLeaderboard();
      if (tab === "matches") fetchMatches();
      if (tab === "record") populatePlayerDropdowns();
    }

    async function fetchLeaderboard() {
      try {
        const res = await fetch(`${apiBaseUrl}/players/`);
        if (!res.ok) throw new Error();
        cachedPlayers = await res.json();
        
        // Sort by ordinal rating descending
        cachedPlayers.sort((a, b) => {
          const ordA = Math.max(0, a.mu - 3 * a.sigma);
          const ordB = Math.max(0, b.mu - 3 * b.sigma);
          return ordB - ordA;
        });

        const tbody = document.getElementById("leaderboard-body");
        if (cachedPlayers.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">No players registered yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = cachedPlayers.map((p, i) => {
          const ordinal = Math.max(0, p.mu - 3 * p.sigma).toFixed(2);
          return `
            <tr class="hover:bg-slate-800/50">
              <td class="p-3 font-mono text-slate-400">#${i + 1}</td>
              <td class="p-3 font-semibold text-slate-100">${p.name}</td>
              <td class="p-3 text-center font-bold text-emerald-400">${ordinal}</td>
              <td class="p-3 text-center text-slate-400">${p.wins} / ${p.losses}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchMatches() {
      try {
        const res = await fetch(`${apiBaseUrl}/matches/`);
        if (!res.ok) throw new Error();
        const matches = await res.json();
        const container = document.getElementById("matches-container");

        if (matches.length === 0) {
          container.innerHTML = `<p class="text-slate-500 text-center py-4">No matches played yet.</p>`;
          return;
        }

        container.innerHTML = matches.map(m => {
          const date = new Date(m.created_at).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
          const t1Win = m.team1_score > m.team2_score;
          return `
            <div class="bg-slate-800 border border-slate-700 p-3 rounded-lg flex flex-col md:flex-row justify-between items-center gap-3">
              <div class="text-xs font-mono text-slate-400">${date}</div>
              <div class="flex items-center gap-4 text-sm w-full md:w-auto justify-center">
                <div class="text-right ${t1Win ? 'text-emerald-400 font-bold' : 'text-slate-300'}">
                  <div>${m.team1_players}</div>
                  <div class="text-xs font-mono opacity-80">Score: ${m.team1_score}</div>
                </div>
                <div class="text-slate-500 font-bold">VS</div>
                <div class="text-left ${!t1Win ? 'text-indigo-400 font-bold' : 'text-slate-300'}">
                  <div>${m.team2_players}</div>
                  <div class="text-xs font-mono opacity-80">Score: ${m.team2_score}</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    function populatePlayerDropdowns() {
      const select1 = document.getElementById("match-team1");
      const select2 = document.getElementById("match-team2");
      const options = cachedPlayers.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
      select1.innerHTML = options;
      select2.innerHTML = options;
    }

    async function registerPlayer(e) {
      e.preventDefault();
      const input = document.getElementById("player-name-input");
      const name = input.value.trim();
      if (!name) return;

      try {
        const res = await fetch(`${apiBaseUrl}/players/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        if (res.ok) {
          input.value = "";
          alert(`Player "${name}" added!`);
          switchTab("leaderboard");
        } else {
          const data = await res.json();
          alert(`Error: ${data.detail || "Could not register player"}`);
        }
      } catch (err) {
        alert("Server request failed.");
      }
    }

    async function submitMatch(e) {
      e.preventDefault();
      const t1 = Array.from(document.getElementById("match-team1").selectedOptions).map(o => o.value);
      const t2 = Array.from(document.getElementById("match-team2").selectedOptions).map(o => o.value);
      const s1 = parseInt(document.getElementById("match-score1").value);
      const s2 = parseInt(document.getElementById("match-score2").value);

      if (t1.length === 0 || t2.length === 0) {
        alert("Please select at least one player for each team.");
        return;
      }

      try {
        const res = await fetch(`${apiBaseUrl}/matches/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            team1_players: t1,
            team2_players: t2,
            team1_score: s1,
            team2_score: s2
          })
        });

        if (res.ok) {
          alert("Match recorded!");
          switchTab("matches");
        } else {
          alert("Failed to submit match.");
        }
      } catch (err) {
        alert("Server request failed.");
      }
    }

    // Run health check on page load
    checkApiHealth();
  </script>
</body>
</html>
